<style data-atgit-offer="css">
/* Horizon welcome nudge — dark theme (footer palette) */
[data-atgit-offer-host] {
  box-sizing: border-box;
}

[data-atgit-offer-host],
[data-atgit-offer-host] * {
  box-sizing: border-box;
}

[data-atgit-offer-host] {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999;
  width: min(360px, calc(100vw - 32px));
  background: rgb(10, 24, 40);
  color: rgba(255, 255, 255, 0.92);
  border: 1px solid rgba(242, 247, 251, 0.22);
  font-family: Figtree, sans-serif;
  padding: 22px 22px 20px;
  box-shadow: 0 10px 32px rgba(14, 33, 54, 0.35);
}

[data-atgit-offer-host][data-atgit-hidden="1"] {
  display: none;
}

[data-atgit-offer-host] .atgit-nudge-eyebrow {
  margin: 0 0 8px;
  font-family: Figtree, sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(242, 247, 251, 0.72);
}

[data-atgit-offer-host] .atgit-nudge-title {
  margin: 0 0 10px;
  font-family: Figtree, sans-serif;
  font-size: 22px;
  font-weight: 700;
  line-height: 1.25;
  color: rgba(255, 255, 255, 0.92);
}

[data-atgit-offer-host] .atgit-nudge-copy {
  margin: 0 0 18px;
  font-family: Figtree, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  color: rgba(255, 255, 255, 0.78);
}

[data-atgit-offer-host] .atgit-nudge-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

[data-atgit-offer-host] .atgit-nudge-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  padding: 11px 18px;
  border: 1px solid rgb(242, 247, 251);
  border-radius: 0;
  background: rgb(242, 247, 251);
  color: rgb(14, 33, 54);
  font-family: Figtree, sans-serif;
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  text-decoration: none;
  cursor: pointer;
}

[data-atgit-offer-host] .atgit-nudge-cta:hover,
[data-atgit-offer-host] .atgit-nudge-cta:focus {
  background: rgb(242, 247, 251);
  border-color: rgb(242, 247, 251);
  color: rgb(10, 24, 40);
  outline: 2px solid rgba(242, 247, 251, 0.45);
  outline-offset: 2px;
}

[data-atgit-offer-host] .atgit-nudge-dismiss {
  margin: 0;
  padding: 8px 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: rgba(255, 255, 255, 0.78);
  font-family: Figtree, sans-serif;
  font-size: 13px;
  font-weight: 500;
  text-decoration: underline;
  cursor: pointer;
}

[data-atgit-offer-host] .atgit-nudge-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 28px;
  height: 28px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: rgba(255, 255, 255, 0.92);
  font-family: Figtree, sans-serif;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}

@media (max-width: 520px) {
  [data-atgit-offer-host] {
    right: 16px;
    bottom: 16px;
    width: calc(100vw - 32px);
    padding: 18px 16px 16px;
  }
}
</style>

<script data-atgit-offer="js">
(function () {
  document.querySelectorAll("[data-atgit-offer-host]").forEach(function (node) {
    node.remove();
  });

  var host = document.createElement("aside");
  host.setAttribute("data-atgit-offer-host", "1");
  host.setAttribute("role", "dialog");
  host.setAttribute("aria-labelledby", "atgit-nudge-title");
  host.setAttribute("aria-describedby", "atgit-nudge-copy");

  var closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.className = "atgit-nudge-close";
  closeBtn.setAttribute("aria-label", "Dismiss welcome message");
  closeBtn.textContent = "×";

  var eyebrow = document.createElement("p");
  eyebrow.className = "atgit-nudge-eyebrow";
  eyebrow.textContent = "Welcome to Horizon";

  var title = document.createElement("h2");
  title.className = "atgit-nudge-title";
  title.id = "atgit-nudge-title";
  title.textContent = "Clear skies. Clear fares.";

  var copy = document.createElement("p");
  copy.className = "atgit-nudge-copy";
  copy.id = "atgit-nudge-copy";
  copy.textContent =
    "Search 500+ airlines with transparent totals and book in minutes. Travelers often save around $84 versus airline-direct—jump into your route below.";

  var actions = document.createElement("div");
  actions.className = "atgit-nudge-actions";

  var cta = document.createElement("a");
  cta.className = "atgit-nudge-cta";
  cta.href = "#search";
  cta.textContent = "Search flights";

  var dismiss = document.createElement("button");
  dismiss.type = "button";
  dismiss.className = "atgit-nudge-dismiss";
  dismiss.textContent = "Maybe later";

  function hideNudge() {
    host.setAttribute("data-atgit-hidden", "1");
    host.remove();
  }

  closeBtn.addEventListener("click", hideNudge);
  dismiss.addEventListener("click", hideNudge);
  cta.addEventListener("click", function () {
    var search = document.querySelector("#search") || document.querySelector("#flight-search");
    if (search && typeof search.scrollIntoView === "function") {
      search.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });

  actions.appendChild(cta);
  actions.appendChild(dismiss);

  host.appendChild(closeBtn);
  host.appendChild(eyebrow);
  host.appendChild(title);
  host.appendChild(copy);
  host.appendChild(actions);

  document.body.appendChild(host);
})();
</script>
