<style data-atgit-offer="css">
/* Hero banner: image swap + 50vh height — scoped to live hero only */
section.hero#search {
  min-height: 50vh;
}

section.hero#search .hero-media {
  min-height: 50vh;
}

section.hero#search .hero-media > img[data-atgit-hero-swap="1"] {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 50vh;
  object-fit: cover;
}
</style>

<script data-atgit-offer="js">
(function () {
  document.querySelectorAll("[data-atgit-offer-host]").forEach(function (node) {
    node.remove();
  });

  var HERO_IMG_URL =
    "https://cdn.magicdecor.in/com/2024/02/16143217/Taj-Mahal-Landscape-Wallpaper-for-Wall.jpg";

  var img =
    document.querySelector("section.hero#search .hero-media > img") ||
    document.querySelector(".hero-media > img");

  if (!img) return;

  img.setAttribute("data-atgit-hero-swap", "1");
  img.src = HERO_IMG_URL;
  img.removeAttribute("srcset");
  img.setAttribute("data-atgit-img-src", HERO_IMG_URL);

  var host = document.createElement("div");
  host.setAttribute("data-atgit-offer-host", "1");
  host.setAttribute("hidden", "");
  host.style.display = "none";

  var media = img.parentElement || document.querySelector("section.hero#search .hero-media");
  if (media) {
    media.appendChild(host);
  }
})();
</script>
